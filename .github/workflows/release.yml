name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install uv and set the build Python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.9"
          enable-cache: true
      - name: Validate the release tag and metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.11 python .github/scripts/release_tools.py validate --ref "$GITHUB_REF" --sha "$GITHUB_SHA"
      - name: Build
        run: uv build --all-packages
      - name: Verify the SDK distribution metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: uv run --no-project --python 3.11 python .github/scripts/release_tools.py verify-dist --dist dist --version "$RELEASE_VERSION"
      - name: Retain the exact distributions for publishing and recovery
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          digest-mismatch: error
      - name: Publish
        id: publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
      - name: Record publication outcome
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [[ "$PUBLISH_OUTCOME" == "success" ]]; then
            echo "PyPI publication succeeded. Retry only failed GitHub finalization jobs, not the whole workflow." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Inspect the Publish logs before retrying: partial PyPI uploads may exist. Retain the original build artifact."
            echo "Publication did not complete. Inspect the Publish logs for partial uploads before any retry." >> "$GITHUB_STEP_SUMMARY"
          fi

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          digest-mismatch: error
      - name: Create or complete the GitHub Release without republishing PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.11 python .github/scripts/release_tools.py finalize --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --dist dist
      - name: Record finalization recovery instructions
        if: failure()
        run: |
          echo "::error::PyPI publication already succeeded. Rerun failed jobs only; do not rerun the entire workflow."
          echo "PyPI publication succeeded. Use **Re-run failed jobs** to retry GitHub finalization with the retained distributions." >> "$GITHUB_STEP_SUMMARY"
