trigger:
- master

pr:
  branches:
    include:
    - '*'

pool:
  vmImage: ubuntu-latest

variables:
- group: azure-kusto-python-e2e

jobs:
- job: BuildAndTest
  displayName: Build and test
  timeoutInMinutes: '60'
  variables:
    PYTHON: $(pythonVersion)
    UV_PYTHON: $(pythonVersion)
    UV_CACHE_DIR: $(Pipeline.Workspace)/uv-cache
  strategy:
    maxParallel: '1'
    matrix:
      Python39:
        pythonVersion: '3.9'
      Python310:
        pythonVersion: '3.10'
      Python311:
        pythonVersion: '3.11'
      Python312:
        pythonVersion: '3.12'
      Python313:
        pythonVersion: '3.13'
  steps:
  - checkout: self
    clean: 'true'

  - task: Cache@2
    displayName: Cache uv dependencies
    inputs:
      key: '"uv" | "$(Agent.OS)" | "$(pythonVersion)" | uv.lock'
      restoreKeys: |
        "uv" | "$(Agent.OS)" | "$(pythonVersion)"
      path: $(UV_CACHE_DIR)

  - bash: |
      set -euo pipefail
      python -m pip install --disable-pip-version-check uv
      uv python install "$(pythonVersion)"
      python_bin="$(dirname "$(uv python find --managed-python "$(pythonVersion)")")"
      export PATH="$python_bin:$PATH"
      echo "##vso[task.prependpath]$python_bin"
      python --version
      python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '$(pythonVersion)'"
      uv tool install --python "$(pythonVersion)" poethepoet
      echo "##vso[task.prependpath]$(uv tool dir --bin)"
      uv --version
    displayName: Install Python $(pythonVersion) and build tools

  - bash: poe test --ci --no-e2e
    displayName: Run tests without Azure credentials
    condition: and(succeeded(), eq(variables['System.PullRequest.IsFork'], 'True'))
    env:
      ENGINE_CONNECTION_STRING: https://dummy.kusto.windows.net

  - task: AzureCLI@2
    displayName: Run unit and Kusto E2E tests
    condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
    inputs:
      azureSubscription: kusto-connectors-arm-sc
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        for name in TEST_DATABASE ENGINE_CONNECTION_STRING; do
          value="${!name:-}"
          if [[ -z "$value" || "$value" == "\$($name)" ]]; then
            echo "##vso[task.logissue type=error]Missing required variable in azure-kusto-python-e2e: $name"
            exit 1
          fi
        done
        for name in TEST_BLOB APPLICATION_INSIGHTS_ENGINE_CONNECTION_STRING APPLICATION_INSIGHTS_TEST_DATABASE; do
          value="${!name:-}"
          if [[ -z "$value" || "$value" == "\$($name)" ]]; then
            echo "##vso[task.logissue type=warning]Optional variable $name is not configured; related E2E coverage may be skipped."
            unset "$name"
          fi
        done
        if [[ -n "${APPLICATION_INSIGHTS_ENGINE_CONNECTION_STRING:-}" && -z "${APPLICATION_INSIGHTS_TEST_DATABASE:-}" ]]; then
          echo "##vso[task.logissue type=error]APPLICATION_INSIGHTS_TEST_DATABASE is required when APPLICATION_INSIGHTS_ENGINE_CONNECTION_STRING is configured."
          exit 1
        fi
        poe test --ci
    env:
      TEST_DATABASE: $(TEST_DATABASE)
      TEST_BLOB: $(TEST_BLOB)
      ENGINE_CONNECTION_STRING: $(ENGINE_CONNECTION_STRING)
      APPLICATION_INSIGHTS_ENGINE_CONNECTION_STRING: $(APPLICATION_INSIGHTS_ENGINE_CONNECTION_STRING)
      APPLICATION_INSIGHTS_TEST_DATABASE: $(APPLICATION_INSIGHTS_TEST_DATABASE)

  - bash: poe check-format
    displayName: Run Ruff formatter check
    condition: always()

  - bash: poe lint
    displayName: Run Ruff linter
    condition: always()

  - bash: poe types
    displayName: Run type checking
    condition: always()
    continueOnError: 'true'

  - bash: poe docs --ci
    displayName: Generate documentation
    condition: and(succeeded(), eq(variables['pythonVersion'], '3.9'), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

  - task: PublishPipelineArtifact@1
    displayName: Upload test results
    condition: always()
    inputs:
      targetPath: pytest.xml
      artifact: Test Results (Python $(pythonVersion))

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: pytest*.xml
      testRunTitle: Python $(pythonVersion)
      failTaskOnMissingResultsFile: true

  - task: PublishPipelineArtifact@1
    displayName: Publish documentation
    condition: and(succeeded(), eq(variables['pythonVersion'], '3.9'), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    inputs:
      targetPath: docs
      artifact: documentation
