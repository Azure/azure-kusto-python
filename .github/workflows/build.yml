# This workflow will install the dependencies, run tests and lint every push

name: Python package
permissions:
  checks: write
  pull-requests: write
  id-token: write
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13' ]
    env:
      PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Poe
        run: uv tool install poethepoet
      - name: EtoE Test with pytest
        env:
          TEST_DATABASE: ${{ secrets.TEST_DATABASE }}
          TEST_BLOB: ${{ secrets.TEST_BLOB }}
          ENGINE_CONNECTION_STRING: ${{ secrets.ENGINE_CONNECTION_STRING }}
          APPLICATION_INSIGHTS_ENGINE_CONNECTION_STRING: https://ade.applicationinsights.io/subscriptions/12534eb3-8109-4d84-83ad-576c0d5e1d06/resourcegroups/clients_e2e_test/providers/microsoft.insights/components/kusto-e2e-app-insights
          APPLICATION_INSIGHTS_TEST_DATABASE: kusto-e2e-app-insights
        run: poe test --ci

      - name: "Run Ruff Formatter"
        run: poe check-format
        id: ruff-formatter
        if: always()

      - name: "Run Ruff Linter"
        run: poe lint
        id: ruff-linter
        if: always()

      - name: "Run Ruff Fixes"
        id: fix-ruff
        if: matrix.python-version == '3.9' && failure() && (steps.ruff-formatter.outcome != 'success' || steps.ruff-linter.outcome != 'success')
        run: poe fix

      - uses: parkerbxyz/suggest-changes@f09e88bbf08621677fa3f4d1f0dd8732ccfd7d70 # v2.0.7
        if: matrix.python-version == '3.9' && failure() && steps.fix-ruff.outcome == 'success'
        with:
          comment: 'Please commit the suggested changes from markdownlint.'
          event: 'REQUEST_CHANGES'

      - name: "Run Type Checking (Optional to passing)"
        if: always()
        run: poe types
        continue-on-error: true
      
      - name: "Generate Docs"
        if: matrix.python-version == '3.9' && github.ref == 'refs/heads/master'
        run: poe docs --ci
        
      - name: "Upload Docs"
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: matrix.python-version == '3.9' && github.ref == 'refs/heads/master'
        with:
          path: docs/
          
      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Unit Test Results (Python ${{ matrix.python-version }})
          path: pytest*.xml

  publish-test-results:
    name: "Publish Unit Tests Results"
    needs: build
    runs-on: ubuntu-latest
    if: always()
    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: artifacts/**/*.xml
  
  publish-docs:
    name: "Publish Docs"
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5